services:
  redis:
    image: redis:7-alpine
    container_name: printguard-redis
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - printguard-network

  printguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printguard-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - MEDIAMTX_API_URL=http://mediamtx:9997/v3
      - MEDIAMTX_WEBRTC_URL=http://mediamtx:8889
      - REDIS_URL=redis://redis:6379
    volumes:
      - printguard-data:/app/data
      - printguard-models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped
    networks:
      - printguard-network

  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mediamtx
    ports:
      - "8889:8889"
      - "8890:8890/udp"
    environment:
      - MTX_API=yes
      - MTX_RTSPTRANSPORTS=tcp
    restart: unless-stopped
    networks:
      - printguard-network

volumes:
  printguard-data:
  printguard-models:

networks:
  printguard-network:
    driver: bridge
